name: nightly

# Runs the test suite on a schedule so breakages caused by new Ende releases
# are caught even when there is no push or pull request activity. On failure it
# opens or updates a tracking issue.

permissions:
  contents: read

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  test:
    # Only run on the upstream repository, not on forks.
    if: github.repository == 'theende/std'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ende
        uses: ./.github/actions/setup-ende

      - name: Run tests
        run: |
          ende task test
          ende task test:with-unsafe-proto

      - name: Lint
        run: ende task lint

      - name: Format
        run: ende fmt --check

  notify:
    needs: test
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "Nightly CI failed";
            const body = [
              "The [nightly CI run](" + runUrl + ") failed. This usually means a",
              "recent Ende release broke `@ende/*`.",
            ].join("\n");

            const { data: issues } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });

            if (issues.total_count > 0) {
              const issue = issues.items[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Nightly CI failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["ci"],
              });
            }
