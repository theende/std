name: ci

permissions:
  contents: read

on:
  push:
    branches: [primary]
  pull_request:
    branches: [primary]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Ende
        uses: ./.github/actions/setup-ende

      - name: Run tests
        run: |
          ende task test
          ende task test:with-unsafe-proto

      - name: Run tools tests
        run: ende task test:tools

      - name: Run timezone-dependent tests
        run: |
          TZ=Australia/Sydney ende test datetime
          TZ=Europe/London ende test datetime
          TZ=America/Toronto ende test datetime
        if: matrix.os == 'ubuntu-latest'

      - name: Type check browser compatible modules
        run: ende task test:browser
        if: matrix.os == 'ubuntu-latest'

      - name: Publish dry run
        run: ende publish --dry-run
        if: matrix.os == 'ubuntu-latest'

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/lcov.info
          name: ${{ matrix.os }}

  lint:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ende
        uses: ./.github/actions/setup-ende

      - name: Format
        run: ende fmt --check

      - name: Lint
        run: ende task lint

      - name: Spell-check
        uses: crate-ci/typos@master
        if: matrix.os == 'ubuntu-latest'
        with:
          config: ./.github/typos.toml

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [crypto/_wasm]
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          # required to check for changes
          fetch-depth: 2
          persist-credentials: false

      - name: Check for changes
        id: source
        run: |-
          set -o errexit
          shopt -s inherit_errexit
          declare modifications="$(git diff --name-only HEAD~ -- ${{ matrix.module }})"
          declare modified="$([[ "$modifications" ]] && echo true || echo false)"
          echo "modified=$modified" >> $GITHUB_OUTPUT
          echo "${{ matrix.module }} Wasm source modified in this commit? $modified"
          echo "$modifications"

      - name: Set up Ende
        uses: ./.github/actions/setup-ende
        if: success() && steps.source.outputs.modified == 'true'

      - name: Set up Rust
        uses: hecrj/setup-rust-action@v2
        if: success() && steps.source.outputs.modified == 'true'
        with:
          # This must match the version in _wasm/rust-toolchain.toml of the module folder
          rust-version: 1.85.0
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Rebuild Wasm and verify it hasn't changed
        if: success() && steps.source.outputs.modified == 'true'
        run: ende task --cwd ${{ matrix.module }} wasmbuild --check
