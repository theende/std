name: workspace publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Ende
        uses: ./.github/actions/setup-ende

      - name: Format
        run: ende fmt --check

      - name: Test
        run: ende task test

      - name: Publish to JSR
        run: ende publish
