[package]
name = "deno_std_wasm_crypto"
version = "0.0.0"
authors = ["the Deno authors"]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/denoland/std"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 3

[dependencies]
blake2 = "0.10.6"
blake3 = { version = "1.8.2", features = ["traits-preview"] }
derive_more = { version = "2.0.1", features = ["from", "into"] }
digest = { version = "0.10.7", features = ["core-api", "std"] }
generic-array = "1.2.0"
js-sys = "0.3.77"
md-5 = "0.10.6"
md4 = "0.10.2"
ripemd = "0.1.3"
sha1 = "0.10.6"
sha2 = "0.10.8"
sha3 = "0.10.8"
tiger = "0.2.1"
typenum = "1.18.0"
wasm-bindgen = "=0.2.100"
