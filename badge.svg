<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="101"
  height="20"
  role="img"
  aria-label="Built with std"
>
  <title>Built with std</title>
  <a
    target="_blank"
    xlink:href="https://jsr.io/@ende"
  >
    <linearGradient id="s" x2="0" y2="100%">
      <stop
        offset="0"
        stop-color="#bbb"
        stop-opacity=".1"
      />
      <stop offset="1" stop-opacity=".1" />
    </linearGradient>
    <clipPath
      id="r"
    >
      <rect width="135" height="20" rx="3" fill="#fff" />
    </clipPath>
    <g
      clip-path="url(#r)"
    >
      <rect width="0" height="20" fill="#555" />
      <rect
        x="0"
        width="135"
        height="20"
        fill="#007ec6"
      />
      <rect width="135" height="20" fill="url(#s)" />
    </g>
    <g
      fill="#fff"
      text-anchor="middle"
      font-family="Verdana,Geneva,DejaVu Sans,sans-serif"
      text-rendering="geometricPrecision"
      font-size="110"
    >
      <image
        x="5"
        y="3"
        width="14"
        height="14"
        xlink:href="data:image/svg+xml;base64,"
      />
      <text
        aria-hidden="true"
        x="595"
        y="150"
        fill="#010101"
        fill-opacity="0.3"
        transform="scale(0.1)"
        textLength="730"
      >Built with std</text>
      <text
        x="595"
        y="140"
        transform="scale(0.1)"
        fill="#fff"
        textLength="730"
      >Built with std</text>
    </g>
  </a>
</svg>
